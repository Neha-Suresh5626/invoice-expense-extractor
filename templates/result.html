<!doctype html>
<html>
  <head>
    <title>Invoice Result</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-light">
    <div class="container mt-5">
      <div class="card shadow p-4">
        <h2 class="mb-4 text-center">Extracted Invoice Details</h2>

        <table class="table table-bordered">
          <tr>
            <th>Invoice Number</th>
            <td>{{ data.invoice_number }}</td>
          </tr>

          <tr>
            <th>GST Amount</th>
            <td>{{ data.gst }}</td>
          </tr>

          <tr>
            <th>Total Amount</th>
            <td>{{ data.total }}</td>
          </tr>
        </table>

        <div class="text-center mt-4">
          <a href="/download" class="btn btn-primary"> Download Excel File </a>
        </div>
      </div>
    </div>
  </body>
</html>
